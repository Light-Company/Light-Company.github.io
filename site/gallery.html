<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Light Company projected intelligence in the room, on the bench, and over the work." />
    <title>Light Company Gallery</title>
    <link rel="canonical" href="https://lightcompany.ai/gallery" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lightcompany.ai/gallery" />
    <meta property="og:title" content="Light Company Gallery" />
    <meta property="og:description" content="Projected intelligence in the room, on the bench, and over the work." />
    <meta property="og:image" content="https://lightcompany.ai/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&display=swap" />
    <link rel="stylesheet" href="/site/gallery/gallery.css" />
    <link rel="preconnect" href="https://www.youtube-nocookie.com" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <script src="/site/gallery/gallery.js" defer></script>
    <script src="/site/assets/gmail-compose.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#films">Skip to the films</a>

    <header class="gallery-header">
      <nav aria-label="Gallery navigation">
        <a href="/">Back to the site</a>
      </nav>
      <a class="brand" href="/" aria-label="Light Company home">
        <svg viewBox="128 124 225 183" aria-hidden="true">
          <defs>
            <linearGradient id="gallery-beam" x1="230.365" y1="223" x2="344.365" y2="223" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#FF3B30" />
              <stop offset=".2" stop-color="#FF9500" />
              <stop offset=".4" stop-color="#FFD60A" />
              <stop offset=".6" stop-color="#34C759" />
              <stop offset=".8" stop-color="#0A84FF" />
              <stop offset="1" stop-color="#AF52DE" />
            </linearGradient>
          </defs>
          <path class="brand-line" d="M264.268 192.995 233.422 135.867c-1.729-3.266-6.295-3.266-8.023 0l-83.688 152.441c-1.729 3.266.545 7.18 4.012 7.18h157.375c3.467 0 5.74-3.914 4.012-7.18l-17.283-34.566c-1.729-3.266-6.295-3.266-8.023 0" />
          <path d="M344.365 183.912 230.365 222.995 344.365 262.078V183.912Z" fill="url(#gallery-beam)" />
        </svg>
        <span>Light Company</span>
      </a>
    </header>

    <main>
      <section class="hero-film" aria-label="Prism, in one film">
        <div class="hero-film-frame" data-hero-video data-video-id="ebPCIoWpk5Y">
          <img class="hero-film-poster" data-hero-poster alt="" />
          <div class="hero-film-player" data-hero-player></div>
          <button class="hero-film-play" type="button" data-hero-play aria-label="Play the Prism film">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor" /></svg>
          </button>
        </div>
        <div class="hero-actions">
          <a class="hero-btn hero-btn-primary" data-preorder href="https://forms.gle/rVGYU4TRfpJBHDjH6" target="_blank" rel="noopener">Preorder for $250</a>
          <a class="hero-btn hero-btn-ghost" href="#contact">Get in touch</a>
        </div>
      </section>

      <section class="gallery-shell" id="films" aria-labelledby="films-title">
        <h2 id="films-title" class="visually-hidden">Gallery</h2>
        <div class="grid" data-gallery-grid aria-live="polite"></div>
        <p class="gallery-error" data-gallery-error hidden>The archive could not load. Refresh this page to try again.</p>
      </section>

      <section class="gallery-end" id="contact">
        <svg viewBox="128 124 225 183" aria-hidden="true">
          <path d="M264.268 192.995 233.422 135.867c-1.729-3.266-6.295-3.266-8.023 0l-83.688 152.441c-1.729 3.266.545 7.18 4.012 7.18h157.375c3.467 0 5.74-3.914 4.012-7.18l-17.283-34.566c-1.729-3.266-6.295-3.266-8.023 0" />
        </svg>
        <p>Bring intelligence into the room.</p>
        <a href="mailto:hello@lght.co?subject=Light%20Company%20Demo">Call or email</a>
        <a href="/privacy">Privacy</a>
      </section>
    </main>

    <div class="lightbox" data-lightbox hidden>
      <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close video">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
      </button>
      <div class="lightbox-backdrop" data-lightbox-close></div>
      <div class="lightbox-panel">
        <div class="lightbox-frame">
          <img data-lightbox-poster class="lightbox-poster" alt="" />
          <div class="lightbox-player" data-lightbox-player></div>
          <div class="lightbox-spinner" data-lightbox-spinner aria-hidden="true"></div>
        </div>
        <p class="lightbox-title" data-lightbox-title></p>
      </div>
    </div>
  </body>
</html>
