<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="author" content="The Light Company" />
    <meta name="description" content="Watch The Light Company's projected intelligence and Prism robotics systems operate in live workspaces, labs, and physical AI evaluation cells." />
    <title>Projected Intelligence Gallery | The Light Company</title>
    <link rel="canonical" href="https://lightcompany.ai/gallery" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lightcompany.ai/gallery" />
    <meta property="og:site_name" content="The Light Company" />
    <meta property="og:title" content="Projected Intelligence Gallery | The Light Company" />
    <meta property="og:description" content="Watch projected intelligence and Prism robotics systems operate in live workspaces and physical AI evaluation cells." />
    <meta property="og:image" content="https://lightcompany.ai/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Projected Intelligence Gallery | The Light Company" />
    <meta name="twitter:description" content="Watch projected intelligence and Prism robotics systems operate in live workspaces and physical AI evaluation cells." />
    <meta name="twitter:image" content="https://lightcompany.ai/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&display=swap" />
    <link rel="stylesheet" href="/site/gallery/gallery.css" />
    <link rel="preconnect" href="https://www.youtube-nocookie.com" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <script src="/site/gallery/gallery.js" defer></script>
    <script src="/site/assets/gmail-compose.js" defer></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "CollectionPage",
            "@id": "https://lightcompany.ai/gallery#webpage",
            "url": "https://lightcompany.ai/gallery",
            "name": "Projected Intelligence Gallery",
            "description": "Films of The Light Company projected intelligence and Prism robotics evaluation systems in physical workspaces.",
            "isPartOf": { "@id": "https://lightcompany.ai/#website" },
            "about": { "@id": "https://lightcompany.ai/#organization" },
            "breadcrumb": { "@id": "https://lightcompany.ai/gallery#breadcrumb" }
          },
          {
            "@type": "BreadcrumbList",
            "@id": "https://lightcompany.ai/gallery#breadcrumb",
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "name": "The Light Company", "item": "https://lightcompany.ai/" },
              { "@type": "ListItem", "position": 2, "name": "Gallery", "item": "https://lightcompany.ai/gallery" }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#films">Skip to the films</a>

    <header class="topbar" aria-label="Main navigation">
      <div class="topbar-start">
      <a class="topbar-mark" href="/" aria-label="The Light Company home">
          <img src="/site/assets/brand/light-company-mark.svg" alt="" />
          <span>Prism</span>
        </a>
      <nav class="topbar-links" aria-label="Primary">
          <a aria-current="page" href="/gallery">Gallery</a>
          <a href="/robotics">Robotics</a>
          <a href="mailto:hello@lght.co?subject=Light%20Company%20Investor">Investors</a>
        </nav>
      </div>
      <div class="topbar-end">
        <a class="signin" href="https://prism.lightcompany.ai">
          <span class="signin-label">Enterprise sign in</span>
          <svg class="signin-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" /></svg>
        </a>
        <a class="topbar-wordmark" href="/">
          <span>The Light Company</span>
          <span class="topbar-locale">San Francisco, CA</span>
        </a>
      </div>
    </header>

    <main>
      <section class="hero-film" aria-label="Prism, in one film">
        <div class="hero-film-frame" data-hero-video data-video-id="ebPCIoWpk5Y">
          <img class="hero-film-poster" data-hero-poster alt="" />
          <div class="hero-film-player" data-hero-player></div>
          <button class="hero-film-play" type="button" data-hero-play aria-label="Play the Prism film">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor" /></svg>
          </button>
        </div>
        <div class="hero-actions">
          <a class="hero-btn hero-btn-primary" data-preorder href="https://forms.gle/rVGYU4TRfpJBHDjH6" target="_blank" rel="noopener">Preorder for $250</a>
          <a class="hero-btn hero-btn-ghost" href="#contact">Get in touch</a>
        </div>
      </section>

      <section class="gallery-shell" id="films" aria-labelledby="films-title">
        <h2 id="films-title" class="visually-hidden">Gallery</h2>
        <div class="grid" data-gallery-grid aria-live="polite"></div>
        <p class="gallery-error" data-gallery-error hidden>The archive could not load. Refresh this page to try again.</p>
      </section>

      <section class="gallery-end" id="contact">
        <svg viewBox="128 124 225 183" aria-hidden="true">
          <path d="M264.268 192.995 233.422 135.867c-1.729-3.266-6.295-3.266-8.023 0l-83.688 152.441c-1.729 3.266.545 7.18 4.012 7.18h157.375c3.467 0 5.74-3.914 4.012-7.18l-17.283-34.566c-1.729-3.266-6.295-3.266-8.023 0" />
        </svg>
        <p>Bring intelligence into the room.</p>
        <a href="mailto:hello@lght.co?subject=Light%20Company%20Demo">Call or email</a>
        <a href="/privacy">Privacy</a>
      </section>
    </main>

    <div class="lightbox" data-lightbox hidden>
      <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close video">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
      </button>
      <div class="lightbox-backdrop" data-lightbox-close></div>
      <div class="lightbox-panel">
        <div class="lightbox-frame">
          <img data-lightbox-poster class="lightbox-poster" alt="" />
          <div class="lightbox-player" data-lightbox-player></div>
          <div class="lightbox-spinner" data-lightbox-spinner aria-hidden="true"></div>
        </div>
        <p class="lightbox-title" data-lightbox-title></p>
      </div>
    </div>
  </body>
</html>
